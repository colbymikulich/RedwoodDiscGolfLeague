<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redwood Disc Golf Club — League Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ── HEADER ── -->
  <header class="hdr">
    <div class="hdr-bg"></div>

    <svg class="tree-strip" viewBox="0 0 800 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="sg" cx="50%" cy="0%" r="60%">
          <stop offset="0%"   stop-color="#E8B800" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#E8B800" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="800" height="90" fill="url(#sg)"/>
      <polygon points="40,90 56,8 72,90"     fill="#1A3A0A" opacity=".6"/>
      <polygon points="36,90 56,28 76,90"    fill="#2A4A1A" opacity=".5"/>
      <polygon points="100,90 118,4 136,90"  fill="#1A3A0A" opacity=".65"/>
      <polygon points="95,90 118,22 141,90"  fill="#2A5A1A" opacity=".45"/>
      <rect x="53"  y="50" width="5" height="40" fill="#3A1A08" opacity=".4"/>
      <rect x="115" y="55" width="5" height="35" fill="#3A1A08" opacity=".4"/>
      <polygon points="170,90 184,12 198,90" fill="#1A3A0A" opacity=".55"/>
      <rect x="181" y="55" width="4" height="35" fill="#3A1A08" opacity=".35"/>
      <polygon points="240,90 258,2 276,90"  fill="#1A3A0A" opacity=".7"/>
      <polygon points="235,90 258,20 281,90" fill="#2A5A1A" opacity=".5"/>
      <rect x="255" y="50" width="5" height="40" fill="#3A1A08" opacity=".4"/>
      <polygon points="320,90 334,14 348,90" fill="#1A3A0A" opacity=".5"/>
      <polygon points="390,90 410,6 430,90"  fill="#1A3A0A" opacity=".65"/>
      <polygon points="385,90 410,24 435,90" fill="#2A5A1A" opacity=".45"/>
      <rect x="407" y="52" width="5" height="38" fill="#3A1A08" opacity=".4"/>
      <polygon points="470,90 486,10 502,90" fill="#1A3A0A" opacity=".55"/>
      <polygon points="465,90 486,28 507,90" fill="#2A4A1A" opacity=".4"/>
      <polygon points="545,90 565,3 585,90"  fill="#1A3A0A" opacity=".7"/>
      <polygon points="540,90 565,22 590,90" fill="#2A5A1A" opacity=".5"/>
      <rect x="562" y="50" width="5" height="40" fill="#3A1A08" opacity=".4"/>
      <polygon points="630,90 646,14 662,90" fill="#1A3A0A" opacity=".55"/>
      <polygon points="700,90 720,7 740,90"  fill="#1A3A0A" opacity=".65"/>
      <polygon points="694,90 720,25 746,90" fill="#2A5A1A" opacity=".45"/>
      <rect x="717" y="52" width="5" height="38" fill="#3A1A08" opacity=".4"/>
      <polygon points="760,90 774,18 788,90" fill="#1A3A0A" opacity=".5"/>
      <rect x="0" y="82" width="800" height="8" fill="#0A1A0A"/>
    </svg>

    <div class="hdr-inner">
      <!-- Basket logo -->
      <div class="basket-logo">
        <div class="basket-topper"><span>REDWOOD<br>DISC GOLF</span></div>
        <div class="basket-pole"></div>
        <svg class="basket-chains-svg" viewBox="0 0 56 46" xmlns="http://www.w3.org/2000/svg">
          <line x1="28" y1="2" x2="10" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <line x1="28" y1="2" x2="15" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <line x1="28" y1="2" x2="20" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <line x1="28" y1="2" x2="25" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <line x1="28" y1="2" x2="28" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <line x1="28" y1="2" x2="31" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <line x1="28" y1="2" x2="36" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <line x1="28" y1="2" x2="41" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <line x1="28" y1="2" x2="46" y2="22" stroke="#8A9A8A" stroke-width="0.8" opacity="0.7"/>
          <ellipse cx="28" cy="22" rx="18" ry="4" fill="none" stroke="#8A9A8A" stroke-width="1.5"/>
          <path d="M10,22 Q10,38 28,38 Q46,38 46,22" fill="none" stroke="#8A9A8A" stroke-width="1.5"/>
          <ellipse cx="28" cy="38" rx="18" ry="3" fill="none" stroke="#8A9A8A" stroke-width="1.5"/>
        </svg>
      </div>

      <div class="hdr-wordmark">Redwood Disc Golf Club</div>
      <div class="hdr-sub">League Tracker</div>
    </div>

    <nav class="nav">
      <button class="nav-btn on" data-page="calendar">Calendar</button>
      <button class="nav-btn"    data-page="players">Players</button>
      <button class="nav-btn"    data-page="upload">+ Upload</button>
    </nav>
  </header>

  <!-- ── CALENDAR PAGE ── -->
  <section id="pg-calendar" class="pg on">
    <div id="cal-list"></div>
    <div id="cal-detail" style="display:none"></div>
  </section>

  <!-- ── PLAYERS PAGE ── -->
  <section id="pg-players" class="pg">
    <input class="search-in" type="text" id="pl-search" placeholder="Search players…">
    <div id="pl-list"></div>
    <div id="pl-detail" style="display:none"></div>
  </section>

  <!-- ── UPLOAD PAGE ── -->
  <section id="pg-upload" class="pg">
    <div class="upload-zone" id="dz">
      <svg class="uz-icon" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="28" cy="12" rx="20" ry="6" fill="var(--yellow)" stroke="var(--yellow-dark)" stroke-width="1.5"/>
        <text x="28" y="15" text-anchor="middle" font-size="6" font-weight="700" fill="var(--forest)" font-family="serif" letter-spacing="0.3">RDGC</text>
        <rect x="26.5" y="18" width="3" height="28" fill="#8A9A8A"/>
        <line x1="28" y1="18" x2="14" y2="34" stroke="#8A9A8A" stroke-width="0.8" opacity=".7"/>
        <line x1="28" y1="18" x2="18" y2="34" stroke="#8A9A8A" stroke-width="0.8" opacity=".7"/>
        <line x1="28" y1="18" x2="22" y2="34" stroke="#8A9A8A" stroke-width="0.8" opacity=".7"/>
        <line x1="28" y1="18" x2="28" y2="34" stroke="#8A9A8A" stroke-width="0.8" opacity=".7"/>
        <line x1="28" y1="18" x2="34" y2="34" stroke="#8A9A8A" stroke-width="0.8" opacity=".7"/>
        <line x1="28" y1="18" x2="38" y2="34" stroke="#8A9A8A" stroke-width="0.8" opacity=".7"/>
        <line x1="28" y1="18" x2="42" y2="34" stroke="#8A9A8A" stroke-width="0.8" opacity=".7"/>
        <ellipse cx="28" cy="34" rx="14" ry="3"  fill="none" stroke="#8A9A8A" stroke-width="1.5"/>
        <path d="M14,34 Q14,46 28,46 Q42,46 42,34" fill="none" stroke="#8A9A8A" stroke-width="1.5"/>
        <ellipse cx="28" cy="46" rx="14" ry="2.5" fill="none" stroke="#8A9A8A" stroke-width="1.5"/>
      </svg>
      <div class="uz-t">Upload score sheet</div>
      <div class="uz-s">Click or drag your .xlsx / .xls file here</div>
      <div class="uz-h">Row 1 = header &nbsp;·&nbsp; Column A = player names &nbsp;·&nbsp; Remaining columns = hole scores</div>
    </div>
    <input type="file" id="fi" accept=".xlsx,.xls" style="display:none">
    <div class="preview-box" id="prev-box"></div>
    <div id="upload-btn-wrap" style="display:none">
      <button class="btn" id="open-modal-btn">Configure &amp; Save Event →</button>
    </div>
  </section>

</div><!-- /#app -->

<!-- ── MODAL ── -->
<div class="modal-ov" id="modal-ov">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">New event details</h2>

    <label for="c-name">Event name</label>
    <input type="text" id="c-name" placeholder="e.g. Spring Opener 2026">

    <label for="c-course">Course</label>
    <input type="text" id="c-course" placeholder="e.g. Hawk's Landing DGC">

    <label for="c-date">Date</label>
    <input type="date" id="c-date">

    <label for="c-format">Hole format</label>
    <select id="c-format">
      <option value="9">9 holes (H1–H9)</option>
      <option value="18" selected>18 holes (H1–H18)</option>
      <option value="custom">Custom — set count &amp; names</option>
    </select>

    <div id="c-custom-wrap" style="display:none">
      <label for="c-count">Number of holes</label>
      <input type="number" id="c-count" min="1" max="36" value="12">
    </div>

    <div class="sec-lbl" id="par-lbl">Par per hole (optional)</div>
    <div class="par-grid" id="par-grid"></div>

    <div class="modal-foot">
      <button class="btn-ghost" id="cancel-btn">Cancel</button>
      <button class="btn"       id="save-btn">Save Event</button>
    </div>
  </div>
</div>

<!-- SheetJS for Excel parsing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
